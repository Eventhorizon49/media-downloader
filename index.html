<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b14"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>Media Downloader</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#070b14}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8faff;background:radial-gradient(circle at 50% 8%,#15254a 0,#0a1020 28%,#070b14 62%);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,select{font:inherit}.wrap{max-width:700px;margin:auto;padding:14px 16px 54px}.home{min-height:calc(100vh - 44px);display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;transform:translateY(-6vh)}.brandrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:18px}.logo{width:50px;height:50px;border-radius:17px;background:linear-gradient(135deg,#28ddff,#3975ff 52%,#b64cff);display:grid;place-items:center;font-size:27px;font-weight:900;box-shadow:0 0 34px #477cff55}.brand{text-align:left;font-size:20px;font-weight:850;letter-spacing:-.4px}.brand small{display:block;color:#8d99b8;font-size:10px;font-weight:650;margin-top:2px}.hero h1{font-size:39px;line-height:1.03;letter-spacing:-1.6px;margin:0 0 10px}.grad{background:linear-gradient(90deg,#4ee8ff,#6d8eff,#c65cff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:#aab4cf;line-height:1.45;margin:0 auto 20px}.card{width:100%;background:linear-gradient(180deg,#131a2af2,#0d1320f4);border:1px solid #29334d;border-radius:24px;padding:16px;box-shadow:0 20px 55px #0007,0 1px 0 #ffffff08 inset}.inputcard{max-width:620px}.inputrow{display:flex;gap:8px}.inputwrap{position:relative;flex:1}input{width:100%;border:1px solid #35415f;border-radius:15px;padding:15px 44px 15px 15px;font-size:16px;outline:none;background:#080e1b;color:white}input::placeholder{color:#68738f}.clear{display:none;position:absolute;right:8px;top:50%;transform:translateY(-50%);width:31px;height:31px;border:0;border-radius:50%;background:#1b2438;color:#b6c0d9}.paste,.newlink{border:1px solid #2d3a59;background:#15213b;color:#9bc2ff;border-radius:14px;padding:0 15px;font-weight:750}.primary{border:0;border-radius:15px;width:100%;padding:15px;background:linear-gradient(90deg,#208dff,#655cff 58%,#a649ff);color:#fff;margin-top:10px;font-size:16px;font-weight:800}.chips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:13px}.chip{background:#0e1628;border:1px solid #283451;border-radius:999px;padding:6px 11px;font-size:12px;color:#aeb8d0}.hint{margin-top:10px;font-size:12px;color:#6f7d9d}.error{display:none;color:#ffbeb9;background:#38191e;border:1px solid #6e313b;padding:11px;border-radius:12px;margin-top:11px;font-size:14px;text-align:left}.result{display:none;margin-top:18px}.resulthead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.eyebrow{font-size:11px;letter-spacing:.13em;color:#7181a4}.resulttitle{font-size:21px;font-weight:850;margin-top:4px;text-align:left}.newlink{padding:10px 13px}.count{font-size:13px;color:#98a4c0;margin-bottom:12px}.viewer{position:relative;border-radius:20px;overflow:hidden;background:#060a12;border:1px solid #27324b}.stage{position:relative;aspect-ratio:4/5;background:#050911;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:pan-y}.stage img{width:100%;height:100%;object-fit:cover}.placeholder{color:#68738f}.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border:1px solid #ffffff22;border-radius:50%;background:#0a1020cc;color:#fff;font-size:25px;z-index:3}.prev{left:10px}.next{right:10px}.counter{position:absolute;right:12px;top:12px;background:#070b14dd;border:1px solid #ffffff22;border-radius:999px;padding:6px 9px;font-size:12px}.dots{display:flex;justify-content:center;gap:7px;padding:10px}.dot{width:7px;height:7px;border-radius:50%;background:#39445f}.dot.active{background:#4b8dff}.info{padding:14px}.mediaTitle{font-size:16px;font-weight:800;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:13px;color:#8793af;margin-top:5px;text-align:left}.downloadrow{display:flex;gap:9px;margin-top:12px}select{flex:1;background:#101829;color:#dce4f5;border:1px solid #2a3652;border-radius:12px;padding:11px}.downloadbtn{border:0;border-radius:12px;background:#2474ff;color:#fff;padding:11px 15px;font-weight:800}.allbtn{margin-top:12px;border:1px solid #3a4770;border-radius:15px;width:100%;padding:14px;background:#11182a;color:#e8edff;font-weight:800}.secondary{margin-top:10px;border:1px solid #2c3854;border-radius:15px;background:#101727;color:#dce4f5;padding:14px;width:100%;font-weight:750}.small{font-size:11px;color:#71809e;text-align:center;margin-top:10px}@media(max-width:520px){.wrap{padding:10px 12px 44px}.home{transform:translateY(-8vh)}.hero h1{font-size:34px}.hero p{font-size:14px}.brandrow{margin-bottom:14px}.inputrow{gap:7px}.paste{padding:0 12px}.card{border-radius:21px}.stage{aspect-ratio:4/5}.resulttitle{font-size:18px}}</style></head><body><div class="wrap"><section class="home" id="home"><div class="brandrow"><div class="logo">↓</div><div class="brand">Media Downloader<small>INSTAGRAM · X · REDDIT</small></div></div><div class="hero"><h1>Save media in the <span class="grad">best available quality.</span></h1><p>Paste a public post link.</p></div><div class="card inputcard"><div class="inputrow"><div class="inputwrap"><input id="url" inputmode="url" autocomplete="off" placeholder="Paste Instagram, X or Reddit link"><button class="clear" id="clearBtn" onclick="clearInput()">×</button></div><button class="paste" onclick="pasteLink()">Paste</button></div><button class="primary" id="analyzeBtn" onclick="analyzeLink()">Analyze Media</button><div class="chips"><span class="chip">Instagram</span><span class="chip">X / Twitter</span><span class="chip">Reddit</span></div><div class="hint">Videos · images · carousels</div><div id="err" class="error"></div></div></section><section id="result" class="card result"><div class="resulthead"><div><div class="eyebrow">MEDIA READY</div><div id="resultTitle" class="resulttitle"></div></div><button class="newlink" onclick="resetForNext()">＋ New link</button></div><div id="count" class="count"></div><div class="viewer"><div id="stage" class="stage"><button id="prev" class="arrow prev" onclick="move(-1)">‹</button><div id="mediaBox" class="placeholder">Preview</div><button id="next" class="arrow next" onclick="move(1)">›</button><div id="counter" class="counter"></div></div><div id="dots" class="dots"></div><div class="info"><div id="mediaTitle" class="mediaTitle"></div><div id="meta" class="meta"></div><div class="downloadrow"><select id="quality"></select><button class="downloadbtn" onclick="downloadCurrent()">Download</button></div></div></div><button id="allBtn" class="allbtn" onclick="downloadAll()">Download all</button><button class="secondary" onclick="resetForNext()">Analyze another link</button><div class="small">Swipe or use arrows to view each media item.</div></section></div><script>let data=null,idx=0,touchX=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function showErr(s){$('err').textContent=s;$('err').style.display='block'}function clearErr(){$('err').style.display='none'}function updateClear(){$('clearBtn').style.display=$('url').value?'block':'none'}async function pasteLink(){try{$('url').value=await navigator.clipboard.readText();updateClear()}catch{$('url').focus()}}function clearInput(){$('url').value='';updateClear();clearErr();$('url').focus()}function resetForNext(){data=null;idx=0;$('result').style.display='none';$('home').style.display='flex';$('url').value='';updateClear();clearErr();window.scrollTo({top:0,behavior:'smooth'});setTimeout(()=>$('url').focus(),200)}function opts(it){let h='<option value="best">Best available</option>';if(it.media_type==='video'){for(const q of it.qualities||[])h+=`<option value="q:${q.height}">${esc(q.label)}</option>`;h+='<option value="audio">Audio only</option>'}return h}function renderCurrent(){let it=data.items[idx];$('counter').textContent=`${idx+1} / ${data.count}`;$('prev').style.display=data.count>1?'block':'none';$('next').style.display=data.count>1?'block':'none';$('mediaBox').innerHTML=it.thumbnail?`<img src="${esc(it.thumbnail)}" alt="Preview">`:'<div class="placeholder">No preview</div>';$('mediaTitle').textContent=it.title||`Media ${idx+1}`;$('meta').textContent=`${it.media_type}${it.width&&it.height?' · '+it.width+' × '+it.height:''}${it.filesize?' · '+formatBytes(it.filesize):''}`;$('quality').innerHTML=opts(it);$('dots').innerHTML=data.items.map((_,i)=>`<span class="dot ${i===idx?'active':''}" onclick="go(${i})"></span>`).join('');$('allBtn').textContent=data.count>1?`Download all (${data.count})`:'Download all';$('allBtn').style.display=data.count>1?'block':'none'}function render(){idx=0;$('resultTitle').textContent=data.title||'Media';$('count').textContent=`${data.count} media item${data.count===1?'':'s'} · ${data.platform}`;$('home').style.display='none';$('result').style.display='block';renderCurrent();window.scrollTo({top:0,behavior:'smooth'})}async function analyzeLink(){clearErr();let u=$('url').value.trim();if(!u){showErr('Paste a supported link first.');return}$('analyzeBtn').disabled=true;$('analyzeBtn').textContent='Analyzing…';try{let r=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:u})});let d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Could not analyze this post.');data=d;render()}catch(e){showErr(e.message)}finally{$('analyzeBtn').disabled=false;$('analyzeBtn').textContent='Analyze Media'}}function move(n){if(!data||data.count<2)return;idx=(idx+n+data.count)%data.count;renderCurrent()}function go(i){idx=i;renderCurrent()}function downloadCurrent(){let it=data.items[idx],v=$('quality').value,mode='best',height='';if(v==='audio')mode='audio';else if(v.startsWith('q:')){mode='quality';height=v.split(':')[1]}location.href='/api/download?token='+encodeURIComponent(it.token)+'&mode='+mode+(height?'&height='+height:'')}async function downloadAll(){try{let r=await fetch('/api/download-batch',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tokens:data.items.map(x=>x.token)})});if(!r.ok){let d=await r.json().catch(()=>({}));throw new Error(d.detail||'Could not prepare download.')}let b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='media-downloader.zip';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000)}catch(e){showErr(e.message)}}function formatBytes(n){let u=['B','KB','MB','GB'],i=Math.min(Math.floor(Math.log(n)/Math.log(1024)),3);return(n/1024**i).toFixed(i?1:0)+' '+u[i]}$('url').addEventListener('input',updateClear);$('url').addEventListener('keydown',e=>{if(e.key==='Enter')analyzeLink()});$('stage').addEventListener('touchstart',e=>touchX=e.touches[0].clientX,{passive:true});$('stage').addEventListener('touchend',e=>{if(touchX==null)return;let d=e.changedTouches[0].clientX-touchX;if(Math.abs(d)>45)move(d<0?1:-1);touchX=null},{passive:true});if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}))</script></body></html>
