name: Publish Android Release
on:
  push:
    branches: [android-private]
    paths:
      - 'release_payload/**'
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct signed APK
        run: |
          mkdir -p dist
          cat release_payload/*.b64 | base64 -d > dist/Media-Downloader-Private-v1.0.apk
          test -s dist/Media-Downloader-Private-v1.0.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v1.0 --yes --cleanup-tag || true
          gh release create android-v1.0 dist/Media-Downloader-Private-v1.0.apk \
            --target android-private \
            --title 'Media Downloader Private v1.0' \
            --notes 'Signed private Android APK. Supports copied-link prompts for Instagram, X/Twitter and Reddit and uses the existing Media Downloader backend. Install by downloading the APK, allowing installs from your browser/file manager when prompted, then enabling Copy Watcher in Android Accessibility settings.'
