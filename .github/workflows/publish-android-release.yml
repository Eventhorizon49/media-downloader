name: Publish Android Release
on:
  push:
    branches: [android-private]
    paths:
      - 'release_payload/**'
      - '.github/workflows/publish-android-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct signed APK
        run: |
          mkdir -p dist
          cat release_payload/*.b64 | base64 -d > dist/Media-Downloader-Private-v1.1.apk
          test -s dist/Media-Downloader-Private-v1.1.apk
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-v1.1 --yes --cleanup-tag || true
          gh release create android-v1.1 dist/Media-Downloader-Private-v1.1.apk \
            --target android-private \
            --title 'Media Downloader Private v1.1' \
            --notes 'Final signed private Android build. Copy a public Instagram, X/Twitter, or Reddit post link and a minimal floating prompt appears. Tap Download for best available quality only. Multi-media posts download every exposed item in best quality. Downloads use the same creator/username + timestamp filename rules as the web app. Enable Copy Watcher once in Android Accessibility settings.'
