name: Improve Instagram story authentication support

on:
  push:
    paths:
      - '.github/workflows/improve-instagram-story-auth.yml'
      - '.github/scripts/improve_instagram_story_auth.py'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update Instagram Story authentication support
        run: python .github/scripts/improve_instagram_story_auth.py

      - name: Format source
        run: |
          python -m pip install --quiet black
          black app.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add robust Instagram Story session support"
            git push origin main
          fi
