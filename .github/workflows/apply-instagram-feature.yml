name: Apply Instagram feature

on:
  push:
    paths:
      - '.github/workflows/apply-instagram-feature.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply feature changes
        run: python .github/scripts/apply_instagram_profile_story.py

      - name: Format source
        run: |
          python -m pip install --quiet black
          black app.py
          npx --yes prettier@3.3.3 --write index.html

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Harden Instagram profile picture downloads"
            git push origin main
          fi

# trigger: hardened-profile-extractor-v2
