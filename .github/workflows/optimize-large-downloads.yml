name: Optimize large downloads and memory use

on:
  push:
    paths:
      - '.github/workflows/optimize-large-downloads.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Optimize downloader memory usage
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('app.py')
          s = p.read_text()

          s = s.replace(
              'import base64, hashlib, hmac, json, os, re, shutil, tempfile, time, zipfile',
              'import base64, hashlib, hmac, json, os, re, shutil, tempfile, threading, time, zipfile',
              1,
          )
          s = s.replace(
              'app = FastAPI(title="Draupnir", version="1.5.1")',
              'app = FastAPI(title="Draupnir", version="1.5.2")',
              1,
          )

          marker = 'DIRECT_EXTS = IMAGE_EXTS + (".mp4", ".mov", ".webm", ".m4a", ".aac")\n'
          if 'DOWNLOAD_SLOT = threading.BoundedSemaphore(1)' not in s:
              if marker not in s:
                  raise SystemExit('DIRECT_EXTS marker not found')
              s = s.replace(
                  marker,
                  marker + '\n# The free Render instance has tight RAM. Serialize heavy media jobs so\n# two large downloads/FFmpeg merges cannot exhaust memory at the same time.\nDOWNLOAD_SLOT = threading.BoundedSemaphore(1)\nSTREAM_CHUNK = 1024 * 1024\n',
                  1,
              )

          s = s.replace('"concurrent_fragment_downloads": 4,', '"concurrent_fragment_downloads": 1,', 1)

          pattern = re.compile(
              r'(?P<i>\s*)r = cr\.get\(s, headers=\{"User-Agent": UA\}, impersonate="chrome", timeout=120\)\n'
              r'(?P=i)if r\.status_code != 200:\n'
              r'(?P=i)    raise RuntimeError\(f"Direct media download failed \(\{r\.status_code\}\)"\)\n'
              r'(?P=i)t\.write_bytes\(r\.content\)\n'
              r'(?P=i)return t'
          )
          m = pattern.search(s)
          if not m:
              raise SystemExit('direct download block not found')
          i = m.group('i')
          replacement = (
              f'{i}r = cr.get(\n'
              f'{i}    s,\n'
              f'{i}    headers={{"User-Agent": UA}},\n'
              f'{i}    impersonate="chrome",\n'
              f'{i}    timeout=300,\n'
              f'{i}    stream=True,\n'
              f'{i})\n'
              f'{i}try:\n'
              f'{i}    if r.status_code != 200:\n'
              f'{i}        raise RuntimeError(f"Direct media download failed ({{r.status_code}})")\n'
              f'{i}    with t.open("wb") as out:\n'
              f'{i}        for chunk in r.iter_content(chunk_size=STREAM_CHUNK):\n'
              f'{i}            if chunk:\n'
              f'{i}                out.write(chunk)\n'
              f'{i}    return t\n'
              f'{i}finally:\n'
              f'{i}    try:\n'
              f'{i}        r.close()\n'
              f'{i}    except Exception:\n'
              f'{i}        pass'
          )
          s = s[:m.start()] + replacement + s[m.end():]

          needle = '        t = download_one(p, d, mode, height, "media")'
          if needle not in s:
              raise SystemExit('single download call not found')
          s = s.replace(
              needle,
              '        with DOWNLOAD_SLOT:\n            t = download_one(p, d, mode, height, "media")',
              1,
          )

          old_loop = '''        for n, t in enumerate(r.tokens):
            fs.append(download_one(unsign(t), d, "best", None, f"media-{n+1:02d}"))'''
          new_loop = '''        with DOWNLOAD_SLOT:
            for n, t in enumerate(r.tokens):
                fs.append(
                    download_one(unsign(t), d, "best", None, f"media-{n+1:02d}")
                )'''
          if old_loop not in s:
              raise SystemExit('batch loop not found')
          s = s.replace(old_loop, new_loop, 1)
          s = s.replace(
              'with zipfile.ZipFile(z, "w", zipfile.ZIP_DEFLATED) as a:',
              'with zipfile.ZipFile(z, "w", zipfile.ZIP_STORED, allowZip64=True) as a:',
              1,
          )

          if '"memory_safe_large_downloads": True,' not in s:
              s = s.replace(
                  '"instagram_auth_configured": instagram_auth_configured(),',
                  '"instagram_auth_configured": instagram_auth_configured(),\n        "memory_safe_large_downloads": True,\n        "download_concurrency": 1,',
                  1,
              )

          s = s.replace('ROOT / "draupnir-icon.svg",\n        media_type="image/svg+xml",', 'ROOT / "draupnir-logo.png",\n        media_type="image/png",', 1)
          p.write_text(s)

          manifest = Path('manifest.webmanifest')
          if manifest.exists():
              m = manifest.read_text().replace('/draupnir-icon.svg', '/draupnir-logo.png')
              manifest.write_text(m)

      - name: Validate and format
        run: |
          python -m py_compile app.py
          python -m pip install --quiet black
          black app.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Optimize large downloads for Render memory limits"
            git push origin main
          fi
