name: Optimize large downloads and memory use

on:
  push:
    paths:
      - '.github/workflows/optimize-large-downloads.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Optimize downloader memory usage
        shell: python
        run: |
          from pathlib import Path

          p = Path('app.py')
          s = p.read_text()

          s = s.replace(
              'import base64, hashlib, hmac, json, os, re, shutil, tempfile, time, zipfile',
              'import base64, hashlib, hmac, json, os, re, shutil, tempfile, threading, time, zipfile',
              1,
          )
          s = s.replace(
              'app = FastAPI(title="Draupnir", version="1.5.1")',
              'app = FastAPI(title="Draupnir", version="1.5.2")',
              1,
          )

          marker = 'DIRECT_EXTS = IMAGE_EXTS + (".mp4", ".mov", ".webm", ".m4a", ".aac")\n'
          if 'DOWNLOAD_SLOT = threading.BoundedSemaphore(1)' not in s:
              s = s.replace(
                  marker,
                  marker + '\n# The free Render instance has tight RAM. Serialize heavy media jobs so\n# two large downloads/FFmpeg merges cannot exhaust memory at the same time.\nDOWNLOAD_SLOT = threading.BoundedSemaphore(1)\nSTREAM_CHUNK = 1024 * 1024\n',
                  1,
              )

          s = s.replace('"concurrent_fragment_downloads": 4,', '"concurrent_fragment_downloads": 1,', 1)

          old_direct = '''        r = cr.get(s, headers={"User-Agent": UA}, impersonate="chrome", timeout=120)
          if r.status_code != 200:
              raise RuntimeError(f"Direct media download failed ({r.status_code})")
          t.write_bytes(r.content)
          return t'''
          new_direct = '''        r = cr.get(
              s,
              headers={"User-Agent": UA},
              impersonate="chrome",
              timeout=300,
              stream=True,
          )
          try:
              if r.status_code != 200:
                  raise RuntimeError(f"Direct media download failed ({r.status_code})")
              with t.open("wb") as out:
                  for chunk in r.iter_content(chunk_size=STREAM_CHUNK):
                      if chunk:
                          out.write(chunk)
              return t
          finally:
              try:
                  r.close()
              except Exception:
                  pass'''
          if old_direct not in s:
              raise SystemExit('direct download block not found')
          s = s.replace(old_direct, new_direct, 1)

          old_download = '''    try:
          t = download_one(p, d, mode, height, "media")
          background_tasks.add_task(shutil.rmtree, d, True)
          return FileResponse(t, filename=t.name, media_type="application/octet-stream")'''
          new_download = '''    try:
          with DOWNLOAD_SLOT:
              t = download_one(p, d, mode, height, "media")
          background_tasks.add_task(shutil.rmtree, d, True)
          return FileResponse(t, filename=t.name, media_type="application/octet-stream")'''
          if old_download not in s:
              raise SystemExit('download endpoint block not found')
          s = s.replace(old_download, new_download, 1)

          old_batch = '''    try:
          for n, t in enumerate(r.tokens):
              fs.append(download_one(unsign(t), d, "best", None, f"media-{n+1:02d}"))
          z = Path(d) / "media-downloader.zip"
          with zipfile.ZipFile(z, "w", zipfile.ZIP_DEFLATED) as a:
              for f in fs:
                  a.write(f, arcname=f.name)'''
          new_batch = '''    try:
          with DOWNLOAD_SLOT:
              for n, t in enumerate(r.tokens):
                  fs.append(
                      download_one(unsign(t), d, "best", None, f"media-{n+1:02d}")
                  )
          z = Path(d) / "media-downloader.zip"
          # Video/image files are already compressed. ZIP_STORED avoids wasting RAM/CPU
          # recompressing large media while keeping the Download all behavior intact.
          with zipfile.ZipFile(z, "w", zipfile.ZIP_STORED, allowZip64=True) as a:
              for f in fs:
                  a.write(f, arcname=f.name)'''
          if old_batch not in s:
              raise SystemExit('batch endpoint block not found')
          s = s.replace(old_batch, new_batch, 1)

          if '"memory_safe_large_downloads": True,' not in s:
              s = s.replace(
                  '"instagram_auth_configured": instagram_auth_configured(),',
                  '"instagram_auth_configured": instagram_auth_configured(),\n        "memory_safe_large_downloads": True,\n        "download_concurrency": 1,',
                  1,
              )

          # The old PWA icon route references an SVG that is not present in the repo.
          # Keep the URL for installed clients, but serve the real PNG asset instead.
          old_icon = '''@app.get("/draupnir-icon.svg")
          def draupnir_icon():
              return FileResponse(
                  ROOT / "draupnir-icon.svg",
                  media_type="image/svg+xml",
                  headers={"Cache-Control": "public,max-age=86400"},
              )'''
          new_icon = '''@app.get("/draupnir-icon.svg")
          def draupnir_icon():
              return FileResponse(
                  ROOT / "draupnir-logo.png",
                  media_type="image/png",
                  headers={"Cache-Control": "public,max-age=86400"},
              )'''
          if old_icon in s:
              s = s.replace(old_icon, new_icon, 1)

          p.write_text(s)

          manifest = Path('manifest.webmanifest')
          if manifest.exists():
              m = manifest.read_text()
              m = m.replace('/draupnir-icon.svg', '/draupnir-logo.png')
              manifest.write_text(m)

      - name: Validate and format
        run: |
          python -m py_compile app.py
          python -m pip install --quiet black
          black app.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py manifest.webmanifest
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Optimize large downloads for Render memory limits"
            git push origin main
          fi
