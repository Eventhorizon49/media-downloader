name: Apply single download guard v2

on:
  push:
    paths:
      - '.github/workflows/apply-single-download-guard-v2.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply changes
        run: python scripts/apply_single_download_guard.py
      - name: Validate
        run: python -m py_compile app.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.py index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Guard concurrent downloads and simplify homepage"
            git push origin main
          fi
