name: Live downloader smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Test deployed app
        env:
          BASE: https://media-downloader-pcbv.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse
          base=os.environ['BASE']
          def get(path, timeout=120):
              with urllib.request.urlopen(base+path, timeout=timeout) as r:
                  return r.status, r.read()
          def post(url):
              data=json.dumps({'url':url}).encode()
              req=urllib.request.Request(base+'/api/analyze',data=data,headers={'Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=120) as r:
                  return r.status,json.loads(r.read())
          for attempt in range(12):
              try:
                  status,body=get('/health',30)
                  if status==200:
                      print('health',body.decode()); break
              except Exception as e:
                  print('warming',e); time.sleep(10)
          else: raise SystemExit('health failed')
          tests={
            'instagram':'https://www.instagram.com/reel/Chunk8-jurw/',
            'x':'https://twitter.com/MesoMax919/status/1575560063510810624',
            'reddit':'https://www.reddit.com/r/Unexpected/comments/1cl9h0u/the_insurance_claim_will_be_interesting/'
          }
          results={}
          for name,url in tests.items():
              try:
                  status,data=post(url)
                  assert status==200 and data.get('token') and data.get('platform')
                  results[name]=data
                  print(name,'OK',data.get('platform'),data.get('height'),len(data.get('qualities') or []))
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  print(name,'FAIL',e.code,body)
                  raise
          token=results['reddit']['token']
          path='/api/download?mode=best&token='+urllib.parse.quote(token,safe='')
          status,blob=get(path,240)
          assert status==200 and len(blob)>1024, (status,len(blob))
          print('download OK',len(blob),'bytes')
          PY