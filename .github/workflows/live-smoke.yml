name: Live downloader smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Test deployed app
        env:
          BASE: https://media-downloader-pcbv.onrender.com
        run: |
          python - <<'PY'
          import json, os, time, urllib.request, urllib.error, urllib.parse
          base=os.environ['BASE']

          def get(path, timeout=120):
              with urllib.request.urlopen(base+path, timeout=timeout) as r:
                  return r.status, r.read()

          def post(url, timeout=120):
              data=json.dumps({'url':url}).encode()
              req=urllib.request.Request(
                  base+'/api/analyze', data=data,
                  headers={'Content-Type':'application/json'}, method='POST'
              )
              try:
                  with urllib.request.urlopen(req,timeout=timeout) as r:
                      return r.status,json.loads(r.read())
              except urllib.error.HTTPError as e:
                  body=e.read().decode(errors='replace')
                  try: payload=json.loads(body)
                  except Exception: payload={'detail':body}
                  return e.code,payload

          # Wait for live service and confirm v1.5 feature flags.
          for attempt in range(12):
              try:
                  status,body=get('/health',30)
                  health=json.loads(body)
                  if status==200 and health.get('instagram_profile_picture') and health.get('instagram_story'):
                      print('health OK',health)
                      break
                  print('waiting for v1.5',health)
              except Exception as e:
                  print('warming',e)
              time.sleep(10)
          else:
              raise SystemExit('v1.5 health failed')

          # Stable Instagram profile-picture test.
          status,profile=post('https://www.instagram.com/instagram/')
          print('profile result',status,profile)
          assert status==200, profile
          assert profile.get('platform')=='Instagram', profile
          assert profile.get('count',0)>=1 and profile.get('items'), profile
          pic=profile['items'][0]
          assert pic.get('media_type')=='image' and pic.get('token'), pic

          # Verify the profile picture can actually be downloaded through Draupnir.
          path='/api/download?mode=best&token='+urllib.parse.quote(pic['token'],safe='')
          status,blob=get(path,240)
          assert status==200 and len(blob)>1024, (status,len(blob))
          print('profile picture download OK',len(blob),'bytes')

          # Story URLs must be recognized as Instagram story inputs. This synthetic
          # expired/nonexistent ID may return auth/unavailable, but must not be rejected
          # as an unsupported URL or misclassified as a profile URL.
          story_url='https://www.instagram.com/stories/instagram/0000000000000000000/'
          status,story=post(story_url)
          print('story route result',status,story)
          assert status in (200,401,404,422), (status,story)
          detail=str(story.get('detail','')).lower() if isinstance(story,dict) else ''
          assert 'profile picture unavailable' not in detail, story
          print('story route OK')

          # Keep one normal Instagram post/reel regression check, but accept platform
          # login/session gating as an external Instagram condition.
          status,ig=post('https://www.instagram.com/reel/Chunk8-jurw/')
          print('instagram reel result',status,ig)
          assert status in (200,401,404,422), (status,ig)
          if status==200:
              assert ig.get('platform')=='Instagram' and ig.get('items'), ig

          print('LIVE SMOKE PASSED')
          PY